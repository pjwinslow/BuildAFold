name: Deploy site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploy:
    name: Deploy to GitHub Pages
    # Only the default branch is published; other branches still run the tests.
    if: github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble the site
        run: node tools/build-site.js
      # Requires Pages to be switched on once, under
      # Settings -> Pages -> Source: "GitHub Actions". The workflow token is
      # not permitted to switch it on itself (it gets "Resource not accessible
      # by integration"), so until that is done this step fails with
      # "Get Pages site failed. Error: Not Found".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
